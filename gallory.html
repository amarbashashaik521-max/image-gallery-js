<!DOCTYPE html>
<html>
<body>
<div id="container">
<link rel="stylesheet" href="gallory.css">
<h1>Image Gallory</h1>
<img id="image" width="400" height="300"><br><br>

<input type="button" value="← Previous" onclick="previous()">


<input type="button" value=" Next →" onclick="next()">

<p id="page-num"></p>

</div>
<script>
let images = ["welcome.jpeg" , "rohit2.jpeg" , "rohitsharma.jpeg" , "rohit4.jpeg" ,"end.jpeg"];
</script>

<script>
let current=0;
document.getElementById("image").src = images[current];
function next()
{
	current=current+1; 
	        
	if(current >= images.length)
	{
    		current = 0;
	}	
	document.getElementById("image").src = images[current];
        document.getElementById("page-num").innerHTML="Image - " + (current + 1) + "/ 5" ;
} 
function previous()
{
	current=current - 1;
	if(current < 0)
  	{
    		current = images.length - 1;
	}

	document.getElementById("image").src = images[current];
        document.getElementById("page-num").innerHTML="Image - " + (current + 1) + "/ 5" ;
}

</script>

</body>
</html>
